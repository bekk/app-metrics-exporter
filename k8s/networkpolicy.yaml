# Default deny for innkommende trafikk i namespacet.
#
# Appen har ingen autentisering, og chaos-endepunktet kan ødelegge SLO-ene.
# Derfor slipper ingenting inn fra andre pods. «kubectl port-forward» og kubelets
# probe-kall påvirkes ikke, fordi den trafikken ikke går gjennom pod-nettverket.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Unntaket fra default deny: den felles Alloy-en i «ns-alloy» må nå
# /actuator/prometheus. Uten denne blir målene oppdaget, men skrapingen
# tidsavbrytes.
#
# namespaceSelector og podSelector står i samme «from»-element, så begge må
# stemme: bare pods med «app.kubernetes.io/name: alloy» i «ns-alloy».
# «kubernetes.io/metadata.name» setter Kubernetes selv på alle namespaces.
#
# Portnummer og ikke portnavn, fordi navngitte porter i NetworkPolicy ikke
# støttes like godt av alle CNI-implementasjoner.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netpol-allow-alloy-scrape
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: app-metrics-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ns-alloy
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - protocol: TCP
          port: 8080

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespacet lages ikke her, men én gang av .github/setup-wif.sh. Deploy-kontoen
# har bare rettigheter inne i namespacet og kan ikke opprette eller endre det.
namespace: ns-app-metrics-exporter

# Knytter podene til Backstage, og Beyla måler bare pods med begge. Blir «service» og
# «team» på metrikkene, og må stemme med ../catalog-info.yaml. includeSelectors er av,
# fordi en selector på en Deployment ikke kan endres etter første deploy.
labels:
  - pairs:
      backstage.io/kubernetes-id: app-metrics-exporter
      team: fleks-grafanaslo
    includeSelectors: false
    includeTemplates: true

resources:
  - networkpolicy.yaml
  - deployment.yaml
  - service.yaml
